name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Only the site group: notebook deps (jax, tensorflow, ...) are never installed here.
      - run: uv sync --locked --only-group site
      - run: uv run --locked --only-group site pytest website/tests
      - run: website/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
